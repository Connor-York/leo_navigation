#Parameters for the robot
#Logging
robot_id: 0
trial_scenario: L_28_Patrol

#Experiment Parameters
time_to_end: 15     # time in minutes   
robot_role: searcher #"patroller", "searcher"
num_robots: 4 # if using the server to send signal measurements it needs to be accounted for
message_rate: 5 # message rate in Hz, max 20Hz, but keep lower for latency with current messaging setup

#Patrol
start_node: 0
patrol_route: lobby.csv
patrol_adjacency: lobby_unit_adj.csv  # Unit adjacency matrix, each row represents a node and the values within are the connected nodes, i.e. row 0 = 1,2
patrol_method: SEBS # "SEBS", "CGG" 

#Search
search_method: ECOLI # "PSO", "ECOLI", "HYBRID"
step_distance: 1.0 # Search step in m (for ecoli primarily but maybe for PSO limiting?)
bad_diff: 1  # RSSI difference to consider a move bad in ECOLI (i.e. if new_rssi < prev_rssi - bad_diff, its bad)
search_end_timer: 5 # time in mins, how long of gbest not moving until it is accepted as final estimate
delay_signal_start: False # Whether to delay the signal being read until a "signal_on" message is received
patrollers_measure: True # Whether patrollers can take signal measurements

#PSO
repulsion_strength: 2 # repulsion for C-PSO (IN METRES)
c1: 1.0 # weighting for pbest
c2: 2.5 # weighting for gbest
w: 1.0 # inertia (< 1.0 slows down over time )
