footprint: [[0.21, 0.22], [0.21, -0.22], [-0.21, -0.22], [-0.21, 0.22]]

# http://wiki.ros.org/costmap_2d/hydro/staticmap
static_layer:
  unknown_cost_value: -1
  lethal_cost_threshold: 100
  map_topic: keepout_map
  first_map_only: false
  subscribe_to_updates: false
  track_unknown_space: true
  use_maximum: false
  trinary_costmap: true

# http://wiki.ros.org/costmap_2d/hydro/obstacles
obstacle_layer:
  max_obstacle_height: 0.3
  obstacle_range: 10 #2.5
  raytrace_range: 10 #3.0
  footprint_clearing_enabled: true
  combination_method: 1
  track_unknown_space: true
  unknown_cost_value: 255

  observation_sources: scan teammates

  scan:
    topic: scan_filtered
    observation_persistence: 0.0
    expected_update_rate: 0.30
    data_type: LaserScan
    clearing: true
    marking: true
    min_obstacle_height: 0.1
    max_obstacle_height: 0.3
    inf_is_valid: false
  
  teammates:
    topic: /teammate_obstacles
    data_type: PointCloud2
    marking: true
    clearing: false
    obstacle_range: 15.0
    raytrace_range: 0.0
    observation_persistence: 0.5

# http://wiki.ros.org/costmap_2d/hydro/inflation <inflation radius default 0.4>
inflation_layer: 
  inflation_radius: 0.3 #0.1 TIGHT 0.4 default
  cost_scaling_factor: 40.0
